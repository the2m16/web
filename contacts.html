    <iframe name="v_iframe" id="v_iframe" style="display:none;" onload="showNotification()"></iframe>

    <script>
        // 1. Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. Mobile Menu Logic
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('active');
        });

        // Гадна талд дарахад хаах
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Линк дарахад хаах
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });
        
        
// CONTACTS FORM SCRIPT START

        var submitted = false;

        // Зурвас амжилттай явсны дараа ажиллах функц
        function showNotification() {
            if(submitted) {
                // 1. Формыг цэвэрлэнэ
                document.getElementById("contactForm").reset();
                
                // 2. Мэдэгдлийн цонхыг гаргаж ирнэ
                var toast = document.getElementById("toast");
                toast.className = "toast-notification show";
                
                // 3. 3 секундын дараа цонхыг буцаагаад нууна
                setTimeout(function(){ 
                    toast.className = toast.className.replace("show", ""); 
                    submitted = false; // Төлөвийг буцааж анхны байдалд нь оруулна
                }, 3000);
            }
        }



    </script>
