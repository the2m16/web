<script>

/* ----------------------------LENIS SCRIPT START-------------------------------- */
        // 1. Lenis
        const lenis = new Lenis({
			duration: 1.2, // Скролл хэр зөөлөн үргэлжлэх хугацаа (секундээр)
			easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Хурдсах уусалт
			smoothWheel: true
			});
		// Хөтчийн скролл хийх болгонд Lenis-ийг байнга шинэчилж ажиллуулах функц
		function raf(time) {
			lenis.raf(time);
			requestAnimationFrame(raf);
			}
		requestAnimationFrame(raf);
/* ----------------------------LENIS SCRIPT END-------------------------------- */
        
/* ----------------------------MENU SCRIPT START-------------------------------- */
        // 2. Mobile Menu Logic
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('active');
        });

        // Гадна талд дарахад хаах
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Линк дарахад хаах
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });
/* ----------------------------MENU SCRIPT END-------------------------------- */

/* ----------------------------ANIMATED TEXT SCRIPT START-------------------------------- */
const messages = [
    "Support The Truth.",
    "Verify The Facts.",
    "Knowledge Is Power.",
	"Support and Protect",
	"The Whistleblower."
];

const container = document.getElementById('anim-container');
let currentIndex = 0; // Одоо харагдаж байгаа мессежийн индекс

function play() {
    container.innerHTML = '';
    
    const currentText = messages[currentIndex];
    const chars = currentText.split('');
    
    chars.forEach((char, index) => {
        const span = document.createElement('span');
        span.textContent = char;
        span.className = 'char';
        span.style.opacity = '0';
        span.style.animation = 'pulse 0.5s forwards';
        span.style.animationDelay = `${index * 0.05}s`;
        container.appendChild(span);
    });
    
    const totalTime = (chars.length * 0.05 * 1000) + (0.5 * 1000) + 2000; 
    // дэлгэц дээр тогтох хугацаа 2000=2sec, 10000=10sec
    setTimeout(() => {
        currentIndex = (currentIndex + 1) % messages.length; // Лүүп
        play();
    }, totalTime);
}

play();
/* ----------------------------ANIMATED TEXT SCRIPT END-------------------------------- */

























/* ----------------------------ACCOUNT NUMBER COPY BUTTON START ------------------------ */
function copyText(elementId, button) {
  // textGroup -> textContent болгож өөрчлөв. Ингэснээр нууцлагдсан 18 орныг шууд уншина.
  const textToCopy = document.getElementById(elementId).textContent;
  
  navigator.clipboard.writeText(textToCopy).then(() => {
    const originalText = button.innerText;
    
    button.innerText = "ХУУЛАГДЛАА!";
    button.classList.add("copied");
    
    setTimeout(() => {
      button.innerText = originalText;
      button.classList.remove("copied");
    }, 2000);
    
  }).catch(err => {
    console.error("Хуулахад алдаа гарлаа: ", err);
  });
}
/* ----------------------------ACCOUNT NUMBER COPY BUTTON END ------------------------ */
    </script>
