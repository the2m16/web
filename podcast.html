	// Жагсаалтыг үүсгэж дэлгэцэнд гаргах функц
	function renderPlaylist() {
		playlistContainer.innerHTML = '';
		episodes.forEach((ep, index) => {
			const item = document.createElement('div');
			item.className = 'list-item';
			item.onclick = () => loadEpisode(index);

			item.innerHTML = `
				<div class="list-info">
					<span class="ep-num">EPISODE #${ep.id}</span>
					<span class="ep-name">${ep.title.length > 38 ? ep.title.substring(0, 38) + " ..." : ep.title}</span></div>
				<div class="play-icon">▶</div>
			`;
			playlistContainer.appendChild(item);
		});
	}

	// Дугаар сонгоход дээд талын мэдээллийг солих функц
	function loadEpisode(index) {
		const ep = episodes[index];

		// CSS класс солих (идэвхтэй харагдуулах)
		const items = document.querySelectorAll('.list-item');
		items.forEach(i => i.classList.remove('active'));
		items[index].classList.add('active');

		// Мэдээллийг шинэчлэх
		activeEpNum.innerText = `EPISODE #${ep.id}`;
		activeEpTitle.innerText = ep.title;
		activeDesc.innerText = ep.desc;
		audioPlayer.src = ep.audio;

		// Шууд тоглуулж эхлэх
		audioPlayer.play();
