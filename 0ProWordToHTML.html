<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>the2m16 - Pro Doc2HTML Studio</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/web/images/favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: Arial, "Calibri", sans-serif;
            overflow: hidden;
        }

        .header {
            background-color: #000;
            color: #fff;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            height: 20px;
            line-height: 20px;
        }

        .container {
            display: flex;
            height: calc(100vh - 40px);
            padding: 10px;
            box-sizing: border-box;
            gap: 10px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #ccc;
            min-width: 0;
        }

        .panel-title {
            background-color: #eee;
            padding: 5px 10px;
            font-size: 16px;
            font-weight: 300;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 3 ЦОНХНЫ НЭГДСЭН СТАЙЛ */
        .editor-shared {
            flex: 1;
            padding: 15px;
            outline: none;
            overflow-y: auto;
            
            /* Таны хүссэн тохиргоо: */
            font-family: Arial, "Calibri", sans-serif !important;
            font-size: 16px !important;
            line-height: 1.4 !important;
        }

        #word-input {
            background-color: #fff;
        }

        #html-output {
            border: none;
            background-color: #fff;
            resize: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
        }

        #preview-window {
            border: none;
            background-color: #fff;
            width: 100%;
            height: 100%;
        }

        button {
            font-size: 11px;
            cursor: pointer;
            padding: 2px 8px;
        }

        .btn-clear { color: #d00; }
    </style>
</head>
<body>

<h1 style="font-size: 1.4rem; margin-left: 15px; color:#ffffff; font-weight: 900;">Doc2HTML Studio <span style="color:#6366f1;">Pro</span></h1>

<div class="container">
    <!-- 1. WORD TEXT -->
    <div class="panel">
        <div class="panel-title">
            WORD TEXT
            <button class="btn-clear" onclick="clearAll()">CLEAR</button>
        </div>
        <div id="word-input" class="editor-shared" contenteditable="true"></div>
    </div>

    <!-- 2. HTML CODE -->
    <div class="panel">
        <div class="panel-title">
            HTML CODE
            <button onclick="copyCode()">COPY</button>
        </div>
        <textarea id="html-output" class="editor-shared" readonly spellcheck="false"></textarea>
    </div>

    <!-- 3. PREVIEW -->
    <div class="panel">
        <div class="panel-title">PREVIEW</div>
        <div class="editor-shared" style="padding:0;">
            <iframe id="preview-window"></iframe>
        </div>
    </div>
</div>

<script>
    const inputArea = document.getElementById('word-input');
    const outputArea = document.getElementById('html-output');
    const previewWindow = document.getElementById('preview-window');

    inputArea.addEventListener('input', () => {
        processContent();
    });

    function processContent() {
        let cleanHtml = cleanWordHtml(inputArea.innerHTML);
        let beautified = beautifyHTML(cleanHtml);
        
        outputArea.value = beautified;
        updatePreview(cleanHtml);
    }

    function cleanWordHtml(html) {
        if (!html || html === '<br>') return '';
        return html
            .replace(/<o:p>\s*<\/o:p>/g, "")
            .replace(/\s*class="[^"]*"/gi, "")
            .replace(/\s*style="[^"]*"/gi, "")
            .replace(/\s*lang="[^"]*"/gi, "")
            .replace(/<(font|span|xml|del|ins|[ovwxp]:\w+)[^>]*?>/gi, "")
            .replace(/<\/(font|span|xml|del|ins|[ovwxp]:\w+)>/gi, "");
    }

    function beautifyHTML(html) {
        if (!html) return '';
        let tab = '  '; 
        let result = '';
        let indent = '';
        html = html.replace(/>\s+</g, '><');
        let elements = html.replace(/(<(?:[^>]+)>)/g, '$1\n').split('\n');

        elements.forEach(function(el) {
            if (!el.trim()) return;
            if (el.match(/^<\/\w/)) indent = indent.substring(tab.length);
            result += indent + el.trim() + '\n';
            if (el.match(/^<\w[^>]*[^\/]>$/) && !el.match(/<(br|img|hr|input|meta|link)/)) {
                indent += tab;
            }
        });
        return result.trim();
    }

    function updatePreview(html) {
        const doc = previewWindow.contentDocument || previewWindow.contentWindow.document;
        doc.open();
        // Preview цонхны доторх фонтыг мөн адил болгох:
        doc.write(`
            <style>
                body { 
                    font-family: Arial, sans-serif; 
                    font-size: 16px; 
                    line-height: 1.4; 
                    margin: 15px; 
                    word-wrap: break-word;
                }
            </style>
            ${html}
        `);
        doc.close();
    }

    function copyCode() {
        if (!outputArea.value) return;
        outputArea.select();
        document.execCommand('copy');
        alert('Copied!');
    }

    function clearAll() {
        inputArea.innerHTML = "";
        outputArea.value = "";
        updatePreview("");
        inputArea.focus();
    }
</script>

</body>
</html>
