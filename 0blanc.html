	<script>
		let currentAlbumImages = [];
		let currentIndex = 0;

		// 1. Бүх албомуудыг автоматаар үүсгэх
		function initAlbums() {
			const albums = document.querySelectorAll('.dynamic-album');

			albums.forEach((albumContainer) => {
				// data-images доторх текстийг авч жагсаалт болгох
				const rawData = albumContainer.getAttribute('data-images');
				const images = rawData.split(',').map(s => s.trim()).filter(s => s !== "");
				const showCount = 4;

				images.forEach((url, i) => {
					if (i < showCount) {
						const item = document.createElement('div');
						item.className = 'album-item';
						item.onclick = () => openLightbox(i, images);

						const img = document.createElement('img');
						img.src = url;
						item.appendChild(img);

						// 4 дэх зураг дээр + тоог харуулах
						if (i === 3 && images.length > 4) {
							const overlay = document.createElement('div');
							overlay.className = 'overlay';
							overlay.innerText = '+' + (images.length - 3);
							item.appendChild(overlay);
						}
						albumContainer.appendChild(item);
					}
				});
			});
		}

		// 2. Lightbox нээх
		function openLightbox(index, images) {
			currentAlbumImages = images;
			currentIndex = index;
			updateLightboxImage();
			document.getElementById('lightbox').style.display = 'flex';
			document.body.style.overflow = 'hidden';
		}

		// 3. Lightbox хаах
		function closeLightbox() {
			document.getElementById('lightbox').style.display = 'none';
			document.body.style.overflow = 'auto';
		}

		// 4. Зураг солих
		function changeImage(step) {
			currentIndex += step;
			if (currentIndex >= currentAlbumImages.length) currentIndex = 0;
			if (currentIndex < 0) currentIndex = currentAlbumImages.length - 1;
			updateLightboxImage();
		}

		function updateLightboxImage() {
			document.getElementById('lightboxImg').src = currentAlbumImages[currentIndex];
		}

		// Гараас удирдах (Arrow keys & Esc)
		document.addEventListener('keydown', (e) => {
			if (document.getElementById('lightbox').style.display === 'flex') {
				if (e.key === "ArrowLeft") changeImage(-1);
				if (e.key === "ArrowRight") changeImage(1);
				if (e.key === "Escape") closeLightbox();
			}
		});

		// Эхлүүлэх
		initAlbums();


<!-- ----------------------------------------------------------------------------------------------------- -->
<!-- МЕНЮ СКРИПТ -->
// 1. МЕНЮ ТОВЧЛУУР ДЭЭР ДАРАХАД НЭЭХ/ХААХ
function myFunction() {
	var x = document.getElementById("myLinks");
	if (x.style.display === "block") {
		x.style.display = "none";
	} else {
		x.style.display = "block";
	}
}

// 2. МЕНЮНИЙ БЛОКИЙН ГАДНА ДАРАХАД ХААХ (Гар утас + PC)
window.addEventListener('mousedown', function(event) {
	var x = document.getElementById("myLinks");
	var menuIcon = document.querySelector(".icon"); // Таны <a> tag-ийн class нэр

	// Хэрэв меню нээлттэй байвал
	if (x.style.display === "block") {
		// Хэрэв даралт меню дотор биш БӨГӨӨД товчлуур дээр биш бол хаах
		if (!x.contains(event.target) && !menuIcon.contains(event.target)) {
			x.style.display = "none";
		}
	}
});

// 3. МЕНЮ ГАР УТАСНЫ TOUCH ҮЙЛДЛИЙГ ДЭМЖИХ
window.addEventListener('touchstart', function(event) {
	var x = document.getElementById("myLinks");
	var menuIcon = document.querySelector(".icon");

	if (x.style.display === "block") {
		if (!x.contains(event.target) && !menuIcon.contains(event.target)) {
			x.style.display = "none";
		}
	}
});

</script>
