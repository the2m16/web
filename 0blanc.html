    <script>
<!-- ----------------------------------------MENU+LENIS SCRIPT START------------------------------------------------------------- -->
        // 1. Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. Mobile Menu Logic
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('active');
        });

        // Гадна талд дарахад хаах
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Линк дарахад хаах
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });
<!-- --------------------------------------MENU+LENIS SCRIPT END--------------------------------------------------------------- -->
        
<!-- -----------------------------------------ALBUM SCRIPT START------------------------------------------------------------ -->
		let currentAlbumImages = [];
		let currentIndex = 0;

		// 1. Бүх албомуудыг автоматаар үүсгэх
		function initAlbums() {
			const albums = document.querySelectorAll('.dynamic-album');

			albums.forEach((albumContainer) => {
				// data-images доторх текстийг авч жагсаалт болгох
				const rawData = albumContainer.getAttribute('data-images');
				const images = rawData.split(',').map(s => s.trim()).filter(s => s !== "");
				const showCount = 4;

				images.forEach((url, i) => {
					if (i < showCount) {
						const item = document.createElement('div');
						item.className = 'album-item';
						item.onclick = () => openLightbox(i, images);

						const img = document.createElement('img');
						img.src = url;
						item.appendChild(img);

						// 4 дэх зураг дээр + тоог харуулах
						if (i === 3 && images.length > 4) {
							const overlay = document.createElement('div');
							overlay.className = 'overlay';
							overlay.innerText = '+' + (images.length - 3);
							item.appendChild(overlay);
						}
						albumContainer.appendChild(item);
					}
				});
			});
		}

		// 2. Lightbox нээх
		function openLightbox(index, images) {
			currentAlbumImages = images;
			currentIndex = index;
			updateLightboxImage();
			document.getElementById('lightbox').style.display = 'flex';
			document.body.style.overflow = 'hidden';
		}

		// 3. Lightbox хаах
		function closeLightbox() {
			document.getElementById('lightbox').style.display = 'none';
			document.body.style.overflow = 'auto';
		}

		// 4. Зураг солих
		function changeImage(step) {
			currentIndex += step;
			if (currentIndex >= currentAlbumImages.length) currentIndex = 0;
			if (currentIndex < 0) currentIndex = currentAlbumImages.length - 1;
			updateLightboxImage();
		}

		function updateLightboxImage() {
			document.getElementById('lightboxImg').src = currentAlbumImages[currentIndex];
		}

		// Гараас удирдах (Arrow keys & Esc)
		document.addEventListener('keydown', (e) => {
			if (document.getElementById('lightbox').style.display === 'flex') {
				if (e.key === "ArrowLeft") changeImage(-1);
				if (e.key === "ArrowRight") changeImage(1);
				if (e.key === "Escape") closeLightbox();
			}
		});

		// Эхлүүлэх
		initAlbums();
<!-- -------------------------------------ALBUM SCRIPT END---------------------------------------------------------------- -->
    </script>
