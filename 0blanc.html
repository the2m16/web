/* IMAGE ALBUM GRID STYLE START */
        .gl-row-grid {
            display: grid; /* Сүлжээ бүтэц асаах */
            grid-template-columns: repeat(auto-fit, minmax(calc(50% - 5px), 1fr)); 
            gap: 6px; /* Зураг хоорондын зай яг 10px */
            max-width: auto; /* Галлерейн хамгийн дээд өргөн */
            width: 100%; /* Утасны дэлгэцэнд уян хатан агших */ }

        .gl-card-item {
            position: relative; /* Доторх маскыг өөртөө харьцангуй байрлуулах */
            background: rgba(255, 255, 255, 0.03); /* Шилэн картын маш нимгэн арын өнгө */
            border-radius: 4px; /* Яг 10px бордер-радиус */
            overflow: hidden; /* Картын хүрээнээс хальсан зургийг далдлах */
            border: 1px solid rgba(255, 255, 255, 0.08); /* Картын нарийн цагаан хүрээ шугам */
            cursor: pointer; /* Хулгана очиход гар гаргах */
            aspect-ratio: 16 / 10; /* Зургийн харьцааг жигд барих */ }

        /* 🌟 Хэрэв ганцхан зураг байвал 16:10 харьцаа хэт өндөр харагдахаас сэргийлж уртааш нь илүү цэгцтэй (кино шиг) харуулах тохиргоо */
        .gl-row-grid[data-count="1"] .gl-card-item {
            aspect-ratio: 21 / 9; }

        .gl-card-item img {
            width: 100%; /* Зургийн өргөнийг хайрцагтаа дүүргэх */
            height: 100%; /* Зургийн өндрийг хайрцагтаа дүүргэх */
            object-fit: cover; /* Зургийг сунгаж гажуудуулахгүйгээр зүсэх */
            transition: transform 0.3s ease; /* Hover хөдөлгөөнийг зөөлөн болгох */ }

        .gl-card-item:hover img {
            transform: scale(1.03); /* Хулгана очиход зөөлөн томрох эффект */ }

        /* БАРУУН ЗУРАГ ДЭЭРХ БАРААН МАСК (Олон зурагтай үед 2 дахь зураг дээр гарна) */
        .gl-dark-mask {
            position: absolute; /* Карт дотор дээгүүр нь бүрэн хучих байрлал */
            top: 0; left: 0; /* Зүүн дээд буланд тулгах */
            width: 100%; height: 100%; /* Картыг тэр чигт нь бүрэн хаах хэмжээ */
            background-color: rgba(0, 0, 0, 0.7); /* Бараан маскны өнгө */
            display: flex; /* Текстийг голлуулах флекс бүтэц */
            justify-content: center; /* Текстийг хэвтээ голлуулах */
            align-items: center; /* Текстийг босоо голлуулах */
            color: #ffffff; /* Тооны өнгийг цагаан болгох */
            font-size: 24px; /* Үсгийн хэмжээ */
            font-weight: bold; /* Үсгийг бүдүүн болгох */
            opacity: 0; /* Анхлан харагдахгүй нууц байна */
            transition: opacity 0.3s ease; /* Маск гарч ирэх хугацааг уусгах */
            pointer-events: none; /* Маск өөрөө зураг дарахад саад болохоос хамгаалах */ }

        .gl-card-item:last-child .gl-dark-mask {
            opacity: 1; /* Зөвхөн хамгийн сүүлийн харагдах карт дээр маскыг ил харуулах */ }

        #gl-lightbox-popup {
            display: none; /* Анхлан вэб ачаалагдахад харагдахгүй нууц байна */
            position: fixed; /* Скролл хийхэд дээшээ гүйхгүй дэлгэцийн цонхонд түгжих (Lenis-ээс хамгаална) */
            z-index: 999999; /* Цэс болон бусад бүх элементээс үргэлж дээгүүр харагдуулах */
            top: 0; left: 0; /* Дэлгэцийн зүүн дээд буланд тулгах */
            width: 100vw; height: 100vh; /* Бүхэл дэлгэцийг бүрэн бүрхэх өргөн, өндөр */
            background: rgba(5, 5, 5, 0.98); /* Лайтбокс ард үүсэх маш харанхуй гоё дэвсгэр */
            justify-content: center; /* Зургийг хэвтээ голд байрлуулах */
            align-items: center; /* Зургийг босоо голд байрлуулах */
            user-select: none; /* Зургийг хэрэглэгч чирч сонгохыг хаах */
            cursor: pointer; /* Нав баттон, хаах товчноос бусад талбайд дарахад хаагдах заагч */ }

        /* Зураг болон түүнийг барьж буй хайрцаг */
        .gl-lightbox-wrapper {
            position: relative; /* Төвлөрсөн байрлал */
            max-width: 85%; /* Дэлгэц халихаас хамгаалах өргөн */
            max-height: 80vh; /* Дэлгэц халихаас хамгаалах босоо өндөр */
            display: flex; /* Зургийг голлуулах флекс */
            justify-content: center; /* Хэвтээ гол */
            align-items: center; /* Босоо гол */
            cursor: default; /* Энэ хайрцаг болон зураг дээр дарахад хаагдахгүй байх тохиргоо */
            margin-bottom: 50px; }

        #gl-lightbox-img {
            max-width: 100%; /* Зургийг хайрцагны өргөнд тулгах */
            max-height: 80vh; /* Зургийг хайрцагны өндөрт тулгах */
            object-fit: contain; /* Зургийг оригиналь харьцаагаар нь харуулах */
            border-radius: 8px; /* Томруулсан зургийн булангуудыг зөөлрүүлэх */ }

        /* НАВИГЭШН ТОВЧНУУД: Босоо 50%, Хэвтээ 10% мэдрэх талбай */
        .gl-nav-zone {
            position: absolute; /* Дэлгэц дээр сумуудыг хадаж байрлуулах */
            top: 25%; /* Дээрээс 25%-ийн зайд эхэлнэ */
            height: 50%; /* Босоо тэнхлэгтээ яг 50% өндөртэй мэдрэх талбай */
            width: 10%; /* Хэвтээ тэнхлэгтээ яг 10% өргөнтэй мэдрэх талбай */
            display: flex; /* Сумны дүрсийг голлуулах бүтэц */
            justify-content: center; /* Сумны дүрсийг хэвтээ голлуулах */
            align-items: center; /* Сумны дүрсийг босоо голлуулах */
            cursor: pointer; /* Хулгана очиход гар гаргах */
            color: rgba(255, 255, 255, 0.4); /* Сумны өнгийг уусгаж бүдгэвтэр болгох */
            font-size: 40px; /* Сумны хэмжээ */
            transition: color 0.2s, background-color 0.2s; /* Hover эффектийг уусгах */
            z-index: 10; /* Зургийн дээр харагдах түвшин */ }

        .gl-nav-zone:hover {
            color: #ffffff; /* Хулгана очиход сум цав цагаан болж тодрох */
            background-color: rgba(255, 255, 255, 0.03); /* Мэдрэх талбайг хэрэглэгчид уусгаж харуулах */ }

        .gl-nav-zone.gl-prev { left: 0; } /* Зүүн талын сумны талбайг зүүн ирмэгт наах */
        .gl-nav-zone.gl-next { right: 0; } /* Баруун талын сумны талбайг баруун ирмэгт наах */

        .gl-close-btn {
            position: absolute; /* Баруун дээд буланд хадах байрлал */
            top: 20px; /* Дээрээс 20px зай авах */
            right: 20px; /* Баруун талаас 20px зай авах */
            font-size: 35px; /* Хаах X тэмдэгтийн хэмжээ */
            color: #ffffff; /* Өнгийг цагаан болгох */
            opacity: 0.6; /* Үл мэдэг бүдгэвтэр байх */
            cursor: pointer; /* Гар гаргах */
            z-index: 20; /* Навигашны мэдрэх талбайнуудаас ч дээгүүр байрлах (Давхцахгүй) */
            padding: 10px; /* Дарахад амар байх дотоод зай */ }

        .gl-close-btn:hover {
            opacity: 1; /* Хулгана очиход тодрох */ }

        #gl-lightbox-caption {
            position: absolute; /* Байрлалыг хадах */
            top: calc(100% + 30px); /* Зургийн доод ирмэгээс 30px зай авах */
            left: 50%; /* Зүүнээс 50% түлхэх */
            transform: translateX(-50%); /* Хэвтээ тэнхлэгт яг голлуулах */

            font-size: 18px; /* Текстийн хэмжээ */

            max-width: 90%; /* Текст урт бол дэлгэц халихаас хамгаалах */
            pointer-events: none; /* Текст өөрөө даралт мэдрэхгүй байх (Хаах үйлдлийг гацаахгүй) */ }

        @media (max-width: 600px) {
            .gl-nav-zone { width: 15%; } /* Утасны дэлгэц жижиг тул мэдрэх талбайг 15% болгох */ }
/* IMAGE ALBUM GRID STYLE END*/

	<script src="https://the2m16.github.io/web/script/lenis.min.js"></script>
    <script>
<!-- ----------------------------------------MENU+LENIS SCRIPT START------------------------------------------------------------- -->
        // 1. Lenis
        const lenis = new Lenis({
			duration: 1.2, // Скролл хэр зөөлөн үргэлжлэх хугацаа (секундээр)
			easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Хурдсах уусалт
			smoothWheel: true
			});
		// Хөтчийн скролл хийх болгонд Lenis-ийг байнга шинэчилж ажиллуулах функц
		function raf(time) {
			lenis.raf(time);
			requestAnimationFrame(raf);
			}
		requestAnimationFrame(raf);
        
        
        
        
        // 2. Mobile Menu Logic
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('active');
        });

        // Гадна талд дарахад хаах
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Линк дарахад хаах
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });
<!-- --------------------------------------MENU+LENIS SCRIPT END--------------------------------------------------------------- -->
        
<!-- -----------------------------------------ALBUM SCRIPT START------------------------------------------------------------ -->
        // 1. Өгөгдлийг уншиж цэвэрлэх
        const glGridContainer = document.querySelector('.gl-row-grid'); /* Галлерейн хайрцгийг барьж авах */
        const glRawData = glGridContainer.getAttribute('data-images').split(','); /* Таслалаар нь салгаж мөрүүд болгох */
        
        const glParsedImages = glRawData.map(item => {
            const parts = item.split('|'); /* Босоо зураасаар нь линк болон тайлбарыг салгах */
            return {
                url: parts[0].trim(), /* Зургийн цэвэр линк хаяг */
                caption: parts[1] ? parts[1].trim() : "Тайлбаргүй" /* Мөр бүрийн тайлбар текст */
            };
        });

        const glTotalImages = glParsedImages.length; /* Нийт зургийн тоо */
        
        // 🌟 Галлерейн үндсэн хайрцагт нийт зургийн тоог атрибутаар оноож өгөх (CSS дээр ганц зурагтайг танихад хэрэгтэй)
        glGridContainer.setAttribute('data-count', glTotalImages);

        // 2. Галлерейг зурж үүсгэх (Хэрэв 1 зураг байвал 1-ийг, олон байвал хамгийн ихдээ эхний 2-ыг харуулна)
        glGridContainer.innerHTML = ''; /* Хуучин хоосон бүтцийг цэвэрлэх */
        
        // 🌟 ОНОШ: 1 зурагтай үед 1 удаа, 2 болон түүнээс дээш зурагтай үед яг 2 удаа давтах ухаалаг тохиргоо
        const displayCount = glTotalImages === 1 ? 1 : 2;
        
        for (let index = 0; index < displayCount; index++) {
            if (!glParsedImages[index]) break; /* Хэрэв зураг байхгүй бол циклийг зогсоөх */
            
            const imgData = glParsedImages[index]; /* Тухайн зургийн өгөгдлийг авах */
            const itemDiv = document.createElement('div'); /* Шинэ галлерейн хайрцаг үүсгэх */
            itemDiv.className = 'gl-card-item'; /* Класс нэрийг оноох */
            
            const img = document.createElement('img'); /* Шинэ зураг элемент үүсгэх */
            img.src = imgData.url; /* Линкийг нь оноох */
            img.loading = "lazy"; /* Lazy ажиллагааг асаах */
            itemDiv.appendChild(img); /* Хайрцаг дотор зургийг хийх */

            // 🌟 Хэрэв нийт зургийн тоо 2-оос их бол 2 дахь нүд маск тавих. 1 бол 2 нүд дамнан зураг харуулах
            if (glTotalImages > 2 && index === 1) {
                const overlay = document.createElement('div'); /* Шинэ маск хайрцаг үүсгэх */
                overlay.className = 'gl-dark-mask'; /* Класс нэр өгөх */
                overlay.innerText = `+${glTotalImages - 1}`; /* Нэгдүгээр зургийг хасаж үлдсэн тоог хэвлэх */
                itemDiv.appendChild(overlay); /* 2 дахь карт дотор маскыг хавчуулах */
            }

            itemDiv.onclick = () => openGlLightbox(index); /* Карт дээр дарахад лайтбокс нээх үйлдлийг уях */
            glGridContainer.appendChild(itemDiv); /* Сайтын дэлгэц рүү картыг зурж гаргах */
        }

        let glCurrentImgIndex = 0; /* Одоо нээлттэй байгаа зургийн дугаар */

        // 3. Лайтбокс функцүүд
        function openGlLightbox(index) {
            glCurrentImgIndex = index; /* Дарагдсан зургийн дугаарыг идэвхжүүлэх */
            updateGlLightbox(); /* Лайтбоксын контентыг шинэчлэх */
            document.getElementById('gl-lightbox-popup').style.display = 'flex'; /* Лайтбоксыг дэлгэцэнд гаргах */
            if (window.lenis) lenis.stop(); /* Ленис скрипт асаалттай байвал скроллыг түр царцаах */
        }

        function updateGlLightbox() {
            const data = glParsedImages[glCurrentImgIndex]; /* Жагсаалтаас одоогийн зургийн өгөгдлийг унших */
            document.getElementById('gl-lightbox-img').src = data.url; /* Зургийн линкийг солих */
            document.getElementById('gl-lightbox-caption').innerText = data.caption; /* Тайлбар текстийг солих */
            
            // 🌟 Хэрэв ганцхан зурагтай галлерей байвал лайтбокс доторх баруун, зүүн сумыг нуух ухаалаг логик
            const navs = document.querySelectorAll('.gl-nav-zone');
            navs.forEach(nav => nav.style.display = glTotalImages === 1 ? 'none' : 'flex');
        }

        function changeGlImage(direction, event) {
            if (event) event.stopPropagation(); /* Сум дээр дарахад арын суурь руу дамжиж хаагдахаас хамгаалах */
            if (glTotalImages === 1) return; /* Ганцхан зурагтай үед сум дарахад хөдлөхгүй */
            glCurrentImgIndex += direction; /* Дугаарыг нэмэх эсвэл хасах */
            if (glCurrentImgIndex >= glTotalImages) glCurrentImgIndex = 0; /* Төгсгөлд хүрвэл эхний зураг руу тойруулах */
            if (glCurrentImgIndex < 0) glCurrentImgIndex = glTotalImages - 1; /* Эхлэлээс буцвал сүүлийн зураг руу үсэргэх */
            updateGlLightbox(); /* Шинэ зургийг хэвлэх */
        }

        function closeGlLightbox() {
            document.getElementById('gl-lightbox-popup').style.display = 'none'; /* Лайтбокс хайрцгийг буцааж нуух */
            if (window.lenis) lenis.start(); /* Лайтбокс хаагдахад Ленис скроллыг буцааж чөлөөлөх */
        }

        // Гарны клав унших (Гарнаас удирдах UX соёл)
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('gl-lightbox-popup').style.display === 'flex') { /* Зөвхөн лайтбокс нээлттэй үед ажиллана */
                if (e.key === 'ArrowRight') changeGlImage(1); /* Баруун сум дарахад дараагийн зураг */
                if (e.key === 'ArrowLeft') changeGlImage(-1); /* Зүүн сум дарахад өмнөх зураг */
                if (e.key === 'Escape') closeGlLightbox(); /* ESC дарахад лайтбоксыг шууд хаах */
            }
        });
<!-- -------------------------------------ALBUM SCRIPT END---------------------------------------------------------------- -->
    </script>




<!-- LIGHT BOX START -->
	<div id="gl-lightbox-popup" onclick="closeGlLightbox()"> <span class="gl-close-btn" onclick="closeGlLightbox()">&times;</span>
    
    	<div class="gl-nav-zone gl-prev" onclick="changeGlImage(-1, event)">&#10094;</div>
    	<div class="gl-nav-zone gl-next" onclick="changeGlImage(1, event)">&#10095;</div>
    
    	<div class="gl-lightbox-wrapper" onclick="event.stopPropagation()">
        	<img src="" id="gl-lightbox-img">
        	<div id="gl-lightbox-caption"></div> 
    	</div>
	</div>
<!-- LIGHT BOX END -->
